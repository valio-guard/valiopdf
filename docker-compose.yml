services:
  valiopdf:
    build: .
    image: valiopdf:latest
    init: true            # reaps Chromium child processes
    ports:
      - "127.0.0.1:${VALIOPDF_PORT:-8000}:8000"
    environment:
      VALIOPDF_API_KEY: ${VALIOPDF_API_KEY:?set VALIOPDF_API_KEY}
      VALIOPDF_MAX_CONCURRENCY: ${VALIOPDF_MAX_CONCURRENCY:-2}
      VALIOPDF_WORKERS: ${VALIOPDF_WORKERS:-1}
      # VALIOPDF_ALLOWED_HOSTS: "cdn.example.com,*.example.org"
      # Signing keys stay on the server (mount them read-only):
      # VALIOPDF_SIGNING_KEYS: '{"company": {"pkcs12": "/keys/company.p12", "password_file": "/run/secrets/company"}}'
      # VALIOPDF_TIMESTAMP_URL: "https://tsa.example/"
      # VALIOPDF_TRUST_ROOTS: "/keys/ca.pem"
    restart: unless-stopped
